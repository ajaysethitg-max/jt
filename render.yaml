# Render Blueprint — one-click server deployment with PostgreSQL.
# Dashboard → New → Blueprint → select this repository. Then set GOOGLE_SHEET_ID
# in the service's Environment tab (optional).
services:
  - type: web
    name: jeet-telecom
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jeet-telecom-db
          property: connectionString
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEET_TAB_PRODUCTS
        sync: false

databases:
  - name: jeet-telecom-db
    plan: free
    databaseName: jeet_telecom
    user: jeet
