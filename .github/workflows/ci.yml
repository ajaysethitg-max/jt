name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  server-build:
    name: Type check + server build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # No database is needed to build: every page renders at request time.
      - run: npx next build

  static-build:
    name: GitHub Pages build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Export static site
        env:
          NEXT_PUBLIC_STATIC_BUILD: "true"
          NEXT_PUBLIC_BASE_PATH: /ci-check
        run: |
          npx next build
          test -f out/index.html
          test -f out/404.html
          test -d out/products
          test ! -d out/api
