name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 00:00 IST every day — refreshes prerendered pages and the baked deal timers
    - cron: "30 18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      # Project sites live at https://user.github.io/<repo>/ ; user sites at the root.
      - name: Detect base path
        id: cfg
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "base=" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static site
        env:
          NEXT_PUBLIC_STATIC_BUILD: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.cfg.outputs.base }}
          # Live catalogue: your Google Sheet (recommended) or the CSV files in /catalog.
          NEXT_PUBLIC_GOOGLE_SHEET_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_SHEET_ID }}
          NEXT_PUBLIC_GOOGLE_SHEETS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_SHEETS_API_KEY }}
          NEXT_PUBLIC_CATALOG_CSV_BASE_URL: ${{ vars.NEXT_PUBLIC_CATALOG_CSV_BASE_URL || format('https://raw.githubusercontent.com/{0}/{1}/catalog', github.repository, github.event.repository.default_branch) }}
          # Also bakes the sheet's catalogue into the prerendered HTML for SEO.
          GOOGLE_SHEET_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_SHEET_ID }}
        run: |
          npx next build
          test -f out/index.html
          test -f out/404.html
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
